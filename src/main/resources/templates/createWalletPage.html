<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins TT — Создать кошелёк</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>   * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --text: #0a1a33;
        --text-soft: #56688a;
        --brand: #0b2a5c;
        --brand-2: #1e4d9c;
        --accent: #3b8dff;
        --accent-soft: rgba(59, 141, 255, 0.15);
        --danger: #e5484d;
        --glass-bg: rgba(240, 247, 255, 0.55);
        --glass-bg-strong: rgba(245, 250, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.8);
        --glass-shadow: 0 1px 1px rgba(255, 255, 255, 0.85) inset, 0 -1px 1px rgba(255, 255, 255, 0.4) inset, 0 20px 40px -12px rgba(11, 42, 92, 0.22), 0 8px 20px -8px rgba(11, 42, 92, 0.14);
        --glass-shadow-hover: 0 1px 1px rgba(255, 255, 255, 0.95) inset, 0 -1px 1px rgba(255, 255, 255, 0.5) inset, 0 34px 66px -16px rgba(11, 42, 92, 0.32), 0 14px 30px -10px rgba(11, 42, 92, 0.2);
    }

    html, body {
        min-height: 100%;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        padding: 40px 20px 60px;
        position: relative;
        overflow-x: hidden;
        background: #e8eff9;
        min-height: 100vh;
    }

    /* ============ СИНИЙ ЖИВОЙ ФОН ============ */
    .bg-canvas {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(1200px 800px at 15% 10%, #cddffb 0%, transparent 60%), radial-gradient(1000px 700px at 85% 20%, #b9d2f7 0%, transparent 55%), radial-gradient(900px 900px at 50% 100%, #a7c4ee 0%, transparent 60%), linear-gradient(180deg, #ecf3fc 0%, #dbe7f8 100%);
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.8;
        animation: float 18s ease-in-out infinite;
        will-change: transform;
    }

    .blob-1 {
        width: 560px;
        height: 560px;
        background: radial-gradient(circle at 30% 30%, #6aa8ff, #2a5fd6 60%, transparent 75%);
        top: -160px;
        left: -140px;
    }

    .blob-2 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle at 60% 40%, #4f7fe8, #1b3f9e 60%, transparent 78%);
        top: 15%;
        right: -200px;
        animation-delay: -4s;
        opacity: 0.7;
    }

    .blob-3 {
        width: 520px;
        height: 520px;
        background: radial-gradient(circle at 50% 50%, #8bb8ff, #3b6fd6 60%, transparent 78%);
        bottom: -180px;
        left: 25%;
        animation-delay: -8s;
    }

    .blob-4 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle at 40% 60%, #5cc3ff, #0a6bd6 60%, transparent 78%);
        top: 50%;
        left: 0%;
        opacity: 0.6;
        animation-delay: -12s;
    }

    @keyframes float {
        0%, 100% {
            transform: translate(0, 0) scale(1);
        }
        33% {
            transform: translate(40px, -30px) scale(1.08);
        }
        66% {
            transform: translate(-30px, 25px) scale(0.96);
        }
    }

    .container {
        max-width: 640px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
    }

    /* ============ HEADER ============ */
    .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        padding: 14px 22px;
        border-radius: 20px;
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        flex-wrap: wrap;
        gap: 16px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 19px;
        color: var(--brand);
        letter-spacing: -0.02em;
        text-decoration: none;
    }

    .logo-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #0a2a5c 0%, #1e4d9c 55%, #3b8dff 100%);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset, 0 8px 20px -6px rgba(30, 77, 156, 0.6);
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.75);
        color: var(--text-soft);
        font-weight: 500;
        font-size: 13.5px;
        text-decoration: none;
        backdrop-filter: blur(10px);
        transition: all 0.2s ease;
    }

    .back-link:hover {
        background: rgba(255, 255, 255, 0.85);
        color: var(--brand);
    }

    /* ============ TITLE ============ */
    .page-title {
        margin-bottom: 28px;
        padding: 0 4px;
    }

    .page-title h1 {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.035em;
        margin-bottom: 8px;
        background: linear-gradient(120deg, #0a1a33 15%, #2a5fd6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.15;
    }

    .page-title p {
        font-size: 15px;
        color: var(--text-soft);
        line-height: 1.5;
    }

    /* ============ FORM CARD (liquid glass) ============ */
    .form-card {
        position: relative;
        border-radius: 24px;
        padding: 32px;
        background: var(--glass-bg);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        overflow: hidden;
        isolation: isolate;
    }

    .form-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 45%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.15) 45%, transparent 100%);
        pointer-events: none;
        z-index: 0;
    }

    .form-card::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 25px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(59, 141, 255, 0) 40%, rgba(59, 141, 255, 0) 60%, rgba(255, 255, 255, 0.6) 100%);
        padding: 1px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: 0;
    }

    .form-card > * {
        position: relative;
        z-index: 1;
    }

    /* ============ FIELDS ============ */
    .field {
        margin-bottom: 22px;
    }

    .field:last-of-type {
        margin-bottom: 28px;
    }

    .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        letter-spacing: -0.01em;
    }

    .field label .req {
        color: var(--danger);
        margin-left: 4px;
    }

    .field .hint-text {
        font-size: 12px;
        color: var(--text-soft);
        margin-top: 6px;
        font-weight: 500;
    }

    .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrap .currency-prefix {
        position: absolute;
        left: 16px;
        font-size: 15px;
        font-weight: 700;
        color: var(--text-soft);
        pointer-events: none;
        z-index: 2;
    }

    .field input, .field textarea {
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 4px 12px -6px rgba(11, 42, 92, 0.12);
        outline: none;
        transition: all 0.2s ease;
    }

    .field input.with-prefix {
        padding-left: 34px;
    }

    .field input::placeholder, .field textarea::placeholder {
        color: #94a3b8;
        font-weight: 400;
    }

    .field input:focus, .field textarea:focus {
        background: rgba(255, 255, 255, 0.85);
        border-color: rgba(59, 141, 255, 0.7);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 0 0 4px var(--accent-soft), 0 8px 20px -8px rgba(30, 77, 156, 0.35);
    }

    .field input.invalid, .field textarea.invalid {
        border-color: rgba(229, 72, 77, 0.6);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 0 0 4px rgba(229, 72, 77, 0.12);
    }

    .field textarea {
        min-height: 90px;
        resize: vertical;
        line-height: 1.5;
    }

    .error-text {
        display: none;
        font-size: 12.5px;
        color: var(--danger);
        margin-top: 6px;
        font-weight: 500;
    }

    .error-text.show {
        display: block;
    }

    /* ============ ACTIONS ============ */
    .form-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .btn {
        padding: 14px 26px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        cursor: pointer;
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .btn-primary {
        flex: 1;
        min-width: 200px;
        color: #fff;
        background: linear-gradient(135deg, #1e4d9c 0%, #2a5fd6 50%, #3b8dff 100%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 -1px 0 rgba(0, 0, 0, 0.15) inset, 0 12px 26px -10px rgba(30, 77, 156, 0.7), 0 6px 14px -6px rgba(11, 42, 92, 0.4);
    }

    .btn-primary::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 45%, transparent 100%);
        pointer-events: none;
        z-index: 0;
    }

    .btn-primary > * {
        position: relative;
        z-index: 1;
    }

    .btn-primary:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset, 0 -1px 0 rgba(0, 0, 0, 0.15) inset, 0 20px 40px -12px rgba(30, 77, 156, 0.8), 0 10px 22px -8px rgba(11, 42, 92, 0.5);
    }

    .btn-primary:active:not(:disabled) {
        transform: translateY(-1px) scale(0.99);
        transition-duration: 0.12s;
    }

    .btn-primary:disabled {
        background: rgba(15, 43, 91, 0.15);
        color: rgba(255, 255, 255, 0.7);
        cursor: not-allowed;
        box-shadow: none;
    }

    .btn-secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 4px 12px -6px rgba(11, 42, 92, 0.15);
    }

    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
    }

    .btn .spinner-mini {
        display: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        vertical-align: -3px;
        margin-right: 6px;
    }

    .btn.loading .spinner-mini {
        display: inline-block;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* ============ ALERT ============ */
    .alert {
        display: none;
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 22px;
        backdrop-filter: blur(14px);
        border: 1px solid;
    }

    .alert.show {
        display: block;
    }

    .alert.success {
        background: rgba(22, 199, 132, 0.12);
        border-color: rgba(22, 199, 132, 0.5);
        color: #0f7a54;
    }

    .alert.error {
        background: rgba(229, 72, 77, 0.1);
        border-color: rgba(229, 72, 77, 0.5);
        color: #a5242a;
    }

    @media (max-width: 640px) {
        body {
            padding: 24px 14px 40px;
        }

        .page-title h1 {
            font-size: 26px;
        }

        .form-card {
            padding: 24px;
            border-radius: 20px;
        }

        .btn-primary {
            min-width: 100%;
        }

        .form-actions {
            flex-direction: column;
        }

        .btn-secondary {
            width: 100%;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .blob {
            animation: none;
        }

        * {
            transition: none !important;
        }
    } </style>
</head>
<body>
<div class="bg-canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
</div>
<div class="container">     <!-- Header -->
    <header class="page-header"><a href="/wallet.html" class="logo">
        <div class="logo-mark">ST</div>
        Skins TT </a> <a href="/menu.html" class="back-link">← Назад к кошелькам</a></header>      <!-- Title -->
    <div class="page-title"><h1>Создать кошелёк</h1>
        <p>Заполните поля ниже, чтобы добавить новый кошелёк в вашу коллекцию.</p></div>      <!-- Form card -->
    <div class="form-card">
        <div class="alert" id="alert"></div>
        <form id="createWalletForm" novalidate>         <!-- Name -->
            <div class="field"><label for="walletName">Название кошелька <span class="req">*</span></label>
                <div class="input-wrap"><input type="text" id="walletName" name="walletName"
                                               placeholder="Например: Main wallet" maxlength="80" autocomplete="off"/>
                </div>
                <div class="error-text" id="err-walletName">Укажите название (2–80 символов).</div>
            </div>          <!-- Description -->
            <div class="field"><label for="walletDescription">Описание</label>
                <div class="input-wrap"><textarea id="walletDescription" name="walletDescription"
                                                  placeholder="Короткое описание кошелька (необязательно)"
                                                  maxlength="255"></textarea></div>
                <div class="hint-text">До 255 символов. Можно оставить пустым.</div>
            </div>          <!-- Amount -->
            <div class="field"><label for="walletTotalAmount">Начальный баланс <span class="req">*</span></label>
                <div class="input-wrap"><span class="currency-prefix">$</span> <input type="number"
                                                                                      id="walletTotalAmount"
                                                                                      name="walletTotalAmount"
                                                                                      class="with-prefix"
                                                                                      placeholder="0.00" min="0"
                                                                                      step="0.01" inputmode="decimal"/>
                </div>
                <div class="error-text" id="err-walletTotalAmount">Введите корректную сумму (0 или больше).</div>
            </div>          <!-- Actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn"><span class="spinner-mini"></span> <span>Создать кошелёк</span>
                </button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
            </div>
        </form>
    </div>
</div>
<script>
    /* Параллакс blob'ов (можно оставить как было) */
    const blobs = document.querySelectorAll('.blob');
    let mx = 0, my = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', (e) => {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
        my = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    (function animate() {
        cx += (mx - cx) * 0.05;
        cy += (my - cy) * 0.05;
        blobs.forEach((b, i) => {
            const d = (i + 1) * 6;
            b.style.marginLeft = `${cx * d}px`;
            b.style.marginTop = `${cy * d}px`;
        });
        requestAnimationFrame(animate);
    })();

    /* ============ ОТПРАВКА ФОРМЫ ============ */
    const API_URL = 'http://localhost:8080/wallet/create';

    const form = document.getElementById('createWalletForm');
    const nameInput = document.getElementById('walletName');
    const descInput = document.getElementById('walletDescription');
    const amountInput = document.getElementById('walletTotalAmount');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const alertBox = document.getElementById('alert');

    function showAlert(type, message) {
        alertBox.className = `alert show ${type}`;
        alertBox.textContent = message;
        if (type === 'success') {
            setTimeout(() => {
                alertBox.className = 'alert';
            }, 5000);
        }
    }

    function hideAlert() {
        alertBox.className = 'alert';
    }

    function setError(input, errId, on) {
        const err = document.getElementById(errId);
        input.classList.toggle('invalid', on);
        err.classList.toggle('show', on);
    }

    function validate() {
        let ok = true;
        const name = nameInput.value.trim();
        const nameValid = name.length >= 2 && name.length <= 80;
        setError(nameInput, 'err-walletName', !nameValid);
        if (!nameValid) ok = false;

        const amountRaw = amountInput.value.trim();
        const amount = parseFloat(amountRaw);
        const amountValid = amountRaw !== '' && !isNaN(amount) && amount >= 0;
        setError(amountInput, 'err-walletTotalAmount', !amountValid);
        if (!amountValid) ok = false;

        return ok;
    }

    nameInput.addEventListener('input', () => setError(nameInput, 'err-walletName', false));
    amountInput.addEventListener('input', () => setError(amountInput, 'err-walletTotalAmount', false));

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        if (!validate()) return;

        const payload = {
            walletName: nameInput.value.trim(),
            walletDescription: descInput.value.trim(),
            walletTotalAmount: parseFloat(amountInput.value)
        };

        console.log('→ POST', API_URL, payload);

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let msg = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    if (errData?.message) msg = errData.message;
                } catch (_) {
                }
                throw new Error(msg);
            }

            showAlert('success', `Кошелёк «${payload.walletName}» успешно создан!`);
            form.reset();

            // Возврат к списку через 1.2 сек
            setTimeout(() => {
                window.location.href = '/view/menu';
            }, 1200);

        } catch (err) {
            console.error('Ошибка создания кошелька:', err);
            showAlert('error', `Не удалось создать кошелёк: ${err.message}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        }
    });

    cancelBtn.addEventListener('click', () => {
        window.location.href = '/view/menu';
    });
</script>
</body>
</html>
